# Configuration of the U-Net that corrects the Sionna RT path gain map.
# lab/configs/config.yaml loads this file into its key `calibration`.
# The method follows Geo2SigMap (arXiv:2312.14303). The ray-traced path gain map replaces its
# U-Net-Iso. The values in use are small: they let the training run on a GPU with 4 GB of
# memory. A comment "Recommended" gives the value for a GPU with more memory.
# The seed is in lab/configs/config.yaml.

network:
  # Channels of the first level. Geo2SigMap uses 64 and 4 levels (about 31 M parameters).
  # 32 and 3 levels give about 1.95 M parameters. A small U-Net is as good as a large one
  # with little data (RadioUNet, arXiv:1911.09002; R2Net, arXiv:2605.18127).
  base_channels: 32
  # Number of down-sampling steps. With 20 m cells, 3 steps give a receptive field of about
  # 68 cells (1.4 km), about the size of the Munich scene.
  depth: 3
  # Groups of each GroupNorm layer (arXiv:1803.08494). Assumption.
  groups: 8

# The loss of the pretraining and of the fine-tuning is the mean absolute error in dB.
# Geo2SigMap uses a loss in dB too (MSE). With the SMAPE of the linear values, the pretraining
# stopped on a plateau for some seeds (2026-11-21).

# Fraction of the pretraining layouts for validation. Assumption.
validation_fraction: 0.2

# Pretraining on the changed scene variants, with Adam as in Geo2SigMap.
pretraining:
  # Geo2SigMap.
  learning_rate: 1.0e-3
  batch_size: 8                   # Recommended: 64 (Geo2SigMap)
  num_epochs: 10                  # Recommended: 200 (Geo2SigMap)

# Fine-tuning of all parameters on the MDT train records. One sample is one received
# (record, cell) pair.
fine_tuning:
  # 10 times smaller than the learning rate of the pretraining. Assumption.
  learning_rate: 1.0e-4
  # Assumption.
  batch_size: 64
  num_epochs: 50                  # Recommended: 200

# Configuration of Sionna RT: the radio parameters and the radio-map solver.
# lab/configs/config.yaml loads this file into its key `simulation`.
# The scene is a key of the scenario (lab/configs/scenario/).

radio:
  frequency_hz: 2.6e9

# Length of one side of a grid cell of the radio map. It must be a multiple of
# scenario.grid.tile_size_m.
radio_map_cell_size_m: 20.0

# Maximum number of transmitters in one call of the radio-map solver. Measured on the Munich
# scene with the values in use on the 4 GB development GPU (RTX 3050 Ti), 2026-11-21:
# 9 transmitters 307 MiB and 8.5 s; 36 transmitters 307 MiB and 6.9 s; 153 transmitters
# 339 MiB and 19.1 s. With samples_per_tx 10000000: 36 transmitters 341 MiB and 11.6 s.
# 153 is the largest value of the test. The largest call of the scenario generator has 153
# transmitters (9 cells and 16 layouts of 9 cells).
radio_map_tx_batch_size: 153

# Arguments of a call of the Sionna RT RadioMapSolver. The code gives center, orientation,
# size, and cell_size from the grid. Each other key goes to the call with no change.
# Measured on the Munich scene with one cell: no ray reaches 72% of the grid cells with
# samples_per_tx 1000000, and 56% with 10000000. About 30% of the cells are in buildings.
radio_map:
  samples_per_tx: 1000000         # Recommended: 10000000
  max_depth: 5                    # Recommended: 8
  los: true                       # default
  specular_reflection: true       # default
  diffuse_reflection: true
  refraction: true                # default
  diffraction: true
  edge_diffraction: false         # default
  diffraction_lit_region: true    # default
  # The root seed of lab/configs/config.yaml.
  seed: ${seed}

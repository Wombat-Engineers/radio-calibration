# Capability: the model corrects the errors of the 3D map (moved, resized, and removed
# buildings) better than Sionna RT and an SPM model with the form of the Atoll planning tool.
# The MDT records are divided at random.
defaults:
  - munich_base
  - _self_

name: munich_map_errors

# Division of the MDT records. `random`: each record goes to one part at random.
# The fractions are assumptions.
split:
  method: random
  fractions: [0.7, 0.1, 0.2]

# Capability: each part of the model is necessary. Each variant changes one part of the full
# model (all channels, pretraining), then goes through the same pretraining and fine-tuning.
# The variants use the same maps.npz, thus they need no more ray tracing.
defaults:
  - munich_base
  - _self_

name: munich_ablation

# pretraining: false starts the fine-tuning from new parameters.
# drop: input channels that the variant does not use.
ablations:
  no_pretraining: {pretraining: false, drop: []}
  no_buildings: {pretraining: true, drop: [max_height, building_fraction]}
  no_los: {pretraining: true, drop: [los]}
  no_distance: {pretraining: true, drop: [distance]}
  no_ray_tracing: {pretraining: true, drop: [path_gain_db, has_path]}

# Division of the MDT records. `random`: each record goes to one part at random.
# The fractions are assumptions.
split:
  method: random
  fractions: [0.7, 0.1, 0.2]

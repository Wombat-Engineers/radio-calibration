[project]
name = "lab"
version = "0.1.0"
description = "Data preparation, experiments, and evaluation of radio-calibration."
requires-python = ">=3.13"
dependencies = [
    "radio-calibration",
    "hydra-core>=1.3.8",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "mitsuba>=3.9.1",
    "notebook>=7.6.5",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sionna-rt>=2.2.0",
    "tensorboard>=2.21.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

# Four top-level modules in lab/. The directories configs/, data/, notebooks/, outputs/,
# reports/, and scripts/ are not modules.
[tool.uv.build-backend]
module-name = ["scenario", "utils", "preprocessing", "experiments"]
module-root = ""

[tool.uv.sources]
radio-calibration = { workspace = true }

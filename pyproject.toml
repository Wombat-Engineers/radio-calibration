[project]
name = "radio-calibration"
version = "0.1.0"
description = "Calibration of Sionna RT radio maps against measurements with PyTorch models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Only the packages that radio_calibration imports. lab/pyproject.toml has the packages of
# the experiments.
dependencies = [
    "drjit>=1.5.0",
    "mitsuba>=3.9.1",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.615.71",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "scipy>=1.18.1",
    "sionna-rt>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

# The importable package is the `radio_calibration` directory at the repository root.
[tool.uv.build-backend]
module-name = "radio_calibration"
module-root = ""

# PyPI has only CPU builds of torch for Windows. The CUDA 13.4 builds are on the PyTorch index.
# A package that must match torch (torchvision, torchaudio) needs its own line in
# [tool.uv.sources], or uv installs the CPU build from PyPI.
[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

# lab/ is the second package of the workspace: data preparation, experiments, evaluation.
[tool.uv.workspace]
members = ["lab"]

[tool.uv.sources]
lab = { workspace = true }
torch = [
    { index = "pytorch-cu134", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
# lab/ holds the top-level modules scenario, utils, preprocessing, and analysis.
src = [".", "lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
lab = ["lab"]

[tool.uv]
default-groups = ["dev", "lab"]

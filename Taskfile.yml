# Task definitions. Install Task from https://taskfile.dev, then:
#   task --list            show each task with its description
#   task --summary <name>  show the full description and the examples of one task
version: "3"

tasks:
  default:
    desc: Show the list of tasks.
    summary: |
      Show each task with its description.

      Example:
        task
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the dependencies and the git hooks.
    summary: |
      Install the locked dependencies into .venv, then install the pre-commit git hooks.
      Run this task one time after you clone the repository, and again after uv.lock changes.

      Example:
        task setup
    cmds:
      - uv sync
      - uv run pre-commit install

  lint:
    desc: Check the code with Ruff (lint rules and format). Changes no file.
    summary: |
      Run the Ruff lint rules and the Ruff format check. The task changes no file.
      Give a path after "--" to check only that path.

      Examples:
        task lint
        task lint -- lab/utils
    cmds:
      - uv run ruff check {{.CLI_ARGS | default "."}}
      - uv run ruff format --check {{.CLI_ARGS | default "."}}

  format:
    desc: Fix the lint findings that Ruff can fix, then format the code.
    summary: |
      Apply the automatic Ruff fixes and the Ruff format. The task changes files.
      Give a path after "--" to change only that path.

      Examples:
        task format
        task format -- tests/test_utils.py
    cmds:
      - uv run ruff check --fix {{.CLI_ARGS | default "."}}
      - uv run ruff format {{.CLI_ARGS | default "."}}

  test:
    desc: Run the tests with pytest. Needs an NVIDIA GPU.
    summary: |
      Run the full test suite. The Mitsuba and Sionna RT tests use CUDA only.
      Give pytest arguments after "--" to run a part of the suite.

      Examples:
        task test
        task test -- -v
        task test -- tests/test_utils.py
        task test -- tests/test_environment.py::test_torch_autograd
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  scenario:
    desc: Generate the data of a scenario in lab/data/<scenario>/raw. Needs an NVIDIA GPU.
    summary: |
      Read lab/configs/config.yaml, then write cells.csv, mdt.csv, and maps.npz to
      lab/data/<scenario>/raw. The task replaces the files from the last run. Hydra writes the
      configuration and the log of the run to lab/outputs/<scenario>/scenario/<date>/<time>.
      Give Hydra overrides after "--". The default scenario is munich_map_errors.

      Examples:
        task scenario
        task scenario -- scenario=munich_new_site
        task scenario -- scenario.traffic.records_per_day=200
        task scenario -- seed=1 simulation.radio_map.max_depth=4
    cmds:
      - uv run python -m scenario {{.CLI_ARGS}}

  notebook:
    desc: Run a notebook from the first cell to the last cell. Needs an NVIDIA GPU.
    summary: |
      Run all cells of a notebook of lab/notebooks/<scenario>/ and write a copy with the outputs
      to lab/outputs/<scenario>/notebooks. The task does not change the notebook. It stops at the
      first cell that fails. Give the path of a notebook after "--". The default is
      lab/notebooks/munich_map_errors/00_scenario.ipynb, which needs the files from "task scenario".

      Examples:
        task notebook
        task notebook -- lab/notebooks/munich_new_site/05_evaluation.ipynb
    vars:
      NOTEBOOK: '{{.CLI_ARGS | default "lab/notebooks/munich_map_errors/00_scenario.ipynb"}}'
    cmds:
      - uv run jupyter nbconvert --execute --to notebook --output-dir lab/outputs/{{base (dir .NOTEBOOK)}}/notebooks {{.NOTEBOOK}}

  pipeline:
    desc: Run the generator and all notebooks of one scenario, then pack the results. Needs an NVIDIA GPU.
    summary: |
      Run "python -m scenario scenario=<name>", then each notebook of lab/notebooks/<name>/ in the
      order of the names. The task uses the configuration in lab/configs/. Change the YAML files
      before the run to use other values. The task stops at the first step that fails. It always
      writes lab/outputs/archives/<start time>_<name>.zip with the data, the results, the
      configuration, and manifest.json (status, steps, versions, GPU).

      Examples:
        task pipeline
        task pipeline -- --scenario munich_ablation
    cmds:
      - uv run python lab/scripts/run_pipeline.py {{.CLI_ARGS}}

  notebooks:
    desc: Run notebooks on the data that exists, then pack the results. Needs an NVIDIA GPU.
    summary: |
      Run the given notebooks of one scenario in this order, or all notebooks of the scenario if
      you give none. The task does not run the scenario generator. It stops at the first notebook
      that fails. It always writes lab/outputs/archives/<start time>_<name>.zip, as
      "task pipeline" does.

      Examples:
        task notebooks
        task notebooks -- --scenario munich_sparse_mdt
        task notebooks -- lab/notebooks/munich_map_errors/04_fine_tuning.ipynb lab/notebooks/munich_map_errors/05_evaluation.ipynb
    cmds:
      - uv run python lab/scripts/run_notebooks.py {{.CLI_ARGS}}

  unpack:
    desc: Extract an archive of "task pipeline" or "task notebooks" to lab/outputs/remote.
    summary: |
      Extract a zip archive to lab/outputs/remote/<archive name>/. The local results do not
      change. Copy the archive from the other machine first, for example with scp.

      Example:
        task unpack -- lab/outputs/archives/20261115-101500.zip
    cmds:
      - uv run python -m zipfile -e {{.CLI_ARGS}} lab/outputs/remote

  hooks:
    desc: Run all pre-commit hooks on all files.
    summary: |
      Run each hook from .pre-commit-config.yaml on all files, not only on staged files.
      Some hooks change files. Run the task again if a hook changed a file.
      Give a hook id after "--" to run only that hook.

      Examples:
        task hooks
        task hooks -- nbstripout
    cmds:
      - uv run pre-commit run --all-files {{.CLI_ARGS}}

  check:
    desc: Run lint, then the tests. Use it before a commit.
    summary: |
      Run the "lint" task, then the "test" task. The task stops at the first failure.

      Example:
        task check
    cmds:
      - task: lint
      - task: test

  lab:
    desc: Start JupyterLab in the lab/notebooks directory.
    summary: |
      Start JupyterLab with the project environment. The browser opens the lab/notebooks directory.
      Stop the server with Ctrl+C.

      Example:
        task lab
    cmds:
      - uv run jupyter lab --notebook-dir=lab/notebooks
